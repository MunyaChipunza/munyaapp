name: Pin Google OAuth account

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pin-google-account.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Google OAuth account selection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "const GCAL_CONNECTED_KEY = 'gcal_connected';\nconst TASK_DIRTY_KEY = 'munyaapp_sync_dirty_at';",
                  "const GCAL_CONNECTED_KEY = 'gcal_connected';\nconst GCAL_LOGIN_HINT = 'chipunzamunya@gmail.com';\nconst TASK_DIRTY_KEY = 'munyaapp_sync_dirty_at';",
              ),
              (
                  "    include_granted_scopes: true,\n    callback: (resp)=>{",
                  "    include_granted_scopes: true,\n    login_hint: GCAL_LOGIN_HINT,\n    callback: (resp)=>{",
              ),
              (
                  "    client.requestAccessToken({prompt:promptMode});",
                  "    client.requestAccessToken({prompt:promptMode,login_hint:GCAL_LOGIN_HINT});",
              ),
              (
                  "  const ok = await requestGoogleToken('select_account');",
                  "  const ok = await requestGoogleToken('');",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify patch
        shell: bash
        run: |
          grep -F "const GCAL_LOGIN_HINT = 'chipunzamunya@gmail.com';" index.html
          grep -F "login_hint: GCAL_LOGIN_HINT" index.html
          grep -F "requestAccessToken({prompt:promptMode,login_hint:GCAL_LOGIN_HINT})" index.html
          grep -F "const ok = await requestGoogleToken('');" index.html
          if grep -F "requestGoogleToken('select_account')" index.html; then
            echo 'Forced account chooser still present'
            exit 1
          fi

      - name: Commit source change
        shell: bash
        run: |
          git config user.name 'Munya App Automation'
          git config user.email 'chipunzamunya@gmail.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No source change required'
            exit 0
          fi
          git commit -m 'Pin Google OAuth to primary account'
          git push origin HEAD:main
