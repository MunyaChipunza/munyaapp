name: Run movie summary migration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Apply current movie task summaries
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error 'https://inquisitive-pastelito-bd6463.netlify.app/api/movie-task-summary-migration?token=qRxSf9FlerqkXQ9HR6tcDbTSdcRuzSxhrZkO7OFnDQI')"
          echo "$response"
          echo "$response" | jq -e '.ok == true and .patched == 17'
